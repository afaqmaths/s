<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبارات آفاق الرياضيات - نماذج قابلة للتنزيل</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');*{box-sizing:border-box}body{font-family:Cairo,'Noto Sans Arabic',Tahoma,sans-serif;direction:rtl;margin:0;background:#f5f7fc;color:#17284c}.toolbar{background:#102650;color:#fff;padding:16px 5%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar a{color:#fff;text-decoration:none}.toolbar button,.toolbar select{font:inherit;border:0;border-radius:9px;padding:9px 16px;cursor:pointer}.toolbar button{background:#f2ba57;color:#16284b;font-weight:900}.toolbar select{padding:9px}.paper{width:min(210mm,100%);margin:25px auto;background:white;min-height:290mm;padding:18mm;box-shadow:0 12px 50px #11284b22}.masthead{border:3px solid #233d72;border-radius:13px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:12px 15px}.masthead small{display:block;font-size:12px;color:#526889}.masthead h1{font-size:22px;line-height:1.5;margin:5px 0}.grade{font-size:16px;white-space:nowrap}.label{font-size:14px;margin:18px 0 9px}.box{border:1px solid #b8c7e1;padding:7px 12px;border-radius:6px}.info{background:#eff5ff;padding:11px 14px;border-radius:7px;font-size:13px;margin:15px 0}.q{border-bottom:1px solid #dce4f3;padding:17px 4px;break-inside:avoid;page-break-inside:avoid}.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.qhead b{font-size:16px;line-height:1.8}.marks{white-space:nowrap;background:#e9efff;border-radius:7px;font-weight:800;font-size:13px;padding:4px 8px}.answer{height:52px;margin-top:15px;background:repeating-linear-gradient(180deg,transparent 0px,transparent 32px,#cad6e8 33px,#cad6e8 34px)}.end{text-align:center;font-size:13px;margin:25px;color:#506789}.disclaimer{font-size:12px;line-height:1.8;color:#62738e}.status{font-size:14px;color:#bde4e9}@media print{@page{size:A4;margin:7mm}body{background:white}.toolbar{display:none!important}.paper{margin:0;width:100%;min-height:auto;box-shadow:none;padding:9mm}.q{padding:12px 2px}.masthead h1{font-size:19px}.answer{height:43px}.info{background:white;border:1px solid #ddd}}@media(max-width:650px){.paper{padding:14px}.toolbar{padding:12px}.masthead h1{font-size:17px}.masthead{grid-template-columns:1fr}.qhead b{font-size:15px}}</style></head><body><header class="toolbar"><a href="index.html#exams">← العودة إلى المنصة</a><label>الصف <select id="grade"><option value="5">الخامس</option><option value="6">السادس</option><option value="7">السابع</option><option value="8">الثامن</option></select></label><label>الفصل <select id="term"><option value="1">الأول</option><option value="2">الثاني</option></select></label><label>النموذج <select id="type"><option value="short1">قصير أول</option><option value="short2">قصير ثانٍ</option><option value="final">نهائي</option></select></label><button id="print">🖨️ حفظ PDF / طباعة</button><button id="word">⬇️ تنزيل نسخة Word</button><span class="status" id="status"></span></header><div class="paper" id="paper"></div><script src="assets/exams-data.js"></script><script>
'use strict';const names={5:'الخامس',6:'السادس',7:'السابع',8:'الثامن'};const params=new URLSearchParams(location.search);for(const id of ['grade','term','type']){const x=document.getElementById(id);if(params.has(id)&&[...x.options].some(o=>o.value===params.get(id)))x.value=params.get(id);x.addEventListener('change',()=>{const p=new URLSearchParams({grade:grade.value,term:term.value,type:type.value});history.replaceState(null,'','?'+p);render()})}function render(){const key=`${grade.value}-${term.value}-${type.value}`,exam=window.AFAQ_EXAM_DATA[key];if(!exam)return;const date=`٢٠٢٦ / ٢٠٢٧`;const html=`<div class="masthead"><div><small>منصة آفاق الرياضيات • نموذج تدريبي أصلي غير رسمي</small><h1>${exam.title} في مادة الرياضيات</h1><small>الفصل الدراسي ${exam.term===1?'الأول':'الثاني'} • ${date}</small></div><div class="grade"><strong>الصف ${names[exam.grade]}</strong><br><b>${exam.total} درجات</b></div></div><div class="label">اسم الطالب: ...................................................................... الشعبة: ..........</div><div class="info">أجب عن جميع الأسئلة. وضح خطوات الحل في أسئلة التطبيق والاستدلال. لكل سؤال الدرجة المبينة أمامه.</div>${exam.questions.map(q=>`<section class="q"><div class="qhead"><b>${q.number}. ${q.text}</b><span class="marks">${q.marks} ${q.marks===1?'درجة':q.marks===2?'درجتان':'درجات'}</span></div><div class="answer"></div></section>`).join('')}<div class="end"><strong>انتهت الأسئلة — وفقك الله وسدد خطاك</strong></div><p class="disclaimer">هذا النموذج أعدته منصة آفاق الرياضيات لأغراض التدريب فقط. لا يمثل اختبارًا وزاريًا معتمدًا، ولا يدّعي المطابقة الحرفية لتوزيع فصول المنهج.</p>`;paper.innerHTML=html}document.getElementById('print').onclick=()=>window.print();document.getElementById('word').onclick=()=>{const base=document.getElementById('paper').innerHTML;const doc=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Tahoma,Arial;line-height:1.9}.q{border-bottom:1px solid #ccc;padding:13px;margin:10px 0}.answer{height:55px}.marks{float:left}</style></head><body>${base}</body></html>`;const blob=new Blob(['\ufeff',doc],{type:'application/msword;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`آفاق-رياضيات-${grade.value}-ف${term.value}-${type.value}.doc`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='تم تجهيز ملف Word'};render();
</script></body></html>
