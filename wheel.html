<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة العجلة الدوارة للأعداد الفردية والأعداد الزوجية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #1e293b;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        .counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 10px auto;
        }

        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ef4444;
            z-index: 10;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            background: conic-gradient(
                #ef4444 0deg 40deg,
                #3b82f6 40deg 80deg,
                #10b981 80deg 120deg,
                #f59e0b 120deg 160deg,
                #8b5cf6 160deg 200deg,
                #ec4899 200deg 240deg,
                #06b6d4 240deg 280deg,
                #84cc16 280deg 320deg,
                #6366f1 320deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);
        }

        .spin-btn {
            background: #2563eb;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .spin-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }

        .spin-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #334155;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .result-msg {
            margin-top: 15px;
            font-size: 1.05rem;
            font-weight: bold;
            white-space: pre-line;
        }

        .correct { color: #16a34a; }
        .wrong { color: #dc2626; }
    </style>
</head>
<body>

    <h1>🎡 لعبة العجلة الدوارة للأعداد الفردية والأعداد الزوجية</h1>
    <div class="counter" id="counter">الأسئلة المتبقية: 9 من 9</div>

    <div class="wheel-container">
        <div class="arrow"></div>
        <div class="wheel" id="wheel"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">دوران العجلة 🎯</button>

    <!-- النافذة المنبثقة للأسئلة -->
    <div class="modal" id="questionModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">السؤال</div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="result-msg" id="resultMsg"></div>
            <button class="close-btn" id="closeBtn" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('questionModal');
        const modalHeader = document.getElementById('modalHeader');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const resultMsg = document.getElementById('resultMsg');
        const counter = document.getElementById('counter');

        let currentRotation = 0;

        // توليد صوت تكتكة العجلة برمجيًا بدون ملفات خارجية
        function playTickSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
        }

        // تحويل النص إلى صوت متكلم (Speech Synthesis)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // قائمة الأسئلة
        const questions = [
            {
                title: 'تحديد الأعداد الزوجية 🔢',
                text: 'أيٌّ من الأعداد التالية أعدادٌ زوجية؟\n(٩ ، ١١ ، ٢٦ ، ٣٣ ، ٥٧ ، ١٨٧ ، ٢٠٠٢)',
                options: ['٢٦ و ٢٠٠٢', '٩ و ١١', '٣٣ و ٥٧', '١٨٧ فقط'],
                correctIndex: 0,
                explanation: '٢٦ و ٢٠٠٢ أعداد زوجية لأن آحادها رقم زوجي.'
            },
            {
                title: 'جمع الأعداد (العبارة ١) ➕',
                text: 'صواب أم خطأ؟\nعدد فردي + عدد فردي + عدد فردي = عدد فردي',
                options: ['صواب', 'خطأ'],
                correctIndex: 0,
                explanation: 'صواب: مجموع 3 أعداد فردية هو دائماً عدد فردي.'
            },
            {
                title: 'جمع الأعداد (العبارة ٢) ➕',
                text: 'صواب أم خطأ؟\nعدد فردي + عدد فردي + عدد زوجي = عدد زوجي',
                options: ['صواب', 'خطأ'],
                correctIndex: 0,
                explanation: 'صواب: (فردي + فردي = زوجي) + زوجي = زوجي.'
            },
            {
                title: 'جمع الأعداد (العبارة ٣) ➕',
                text: 'صواب أم خطأ؟\nعدد زوجي + عدد زوجي + عدد فردي = عدد زوجي',
                options: ['صواب', 'خطأ'],
                correctIndex: 1,
                explanation: 'خطأ: (زوجي + زوجي = زوجي) + فردي = عدد فردي.'
            },
            {
                title: 'مسألة فيصل 🧠',
                text: 'يقول فيصل: "جمعت ثلاثة أعداد فردية وكان الناتج ٢٠". هل عبارة فيصل صحيحة؟',
                options: ['صحيحة', 'غير صحيحة'],
                correctIndex: 1,
                explanation: 'عبارة غير صحيحة؛ لأن مجموع 3 أعداد فردية يكون دائماً عدداً فردياً والـ 20 عدد زوجي.'
            },
            {
                title: 'مسألة طارق (الأعداد الأولية) 🧮',
                text: 'يقول طارق: "عند جمع ٣ أعداد أولية مختلفة فإن الناتج يكون دائماً عدداً فردياً". هل طارق على صواب؟',
                options: ['نعم، على صواب', 'لا، ليس على صواب'],
                correctIndex: 1,
                explanation: 'ليس على صواب؛ لأنه لو اخترنا العدد الأول الزوجي (٢) مع عددين فرديين (مثلاً ٣ و ٥): ٢ + ٣ + ٥ = ١٠ (عدد زوجي).'
            },
            {
                title: 'مضاعفات الأعداد ٥ و ١٠ 📊',
                text: 'حدد أي العبارات التالية صحيحة:',
                options: [
                    'جميع مضاعفات العدد ٥ أعداد فردية',
                    'جميع مضاعفات العدد ١٠ أعداد زوجية'
                ],
                correctIndex: 1,
                explanation: 'جميع مضاعفات العدد 10 آحادها (0) فهي دائماً زوجية. أما مضاعفات 5 فتكون فردية وزوجية.'
            },
            {
                title: 'مسألة سالم 🙋‍♂️',
                text: 'يقول سالم: "جمعتُ عددين فرديين وأضفتُ إليهما عدداً زوجياً وكانت إجابتي ٢١". هل إجابة سالم صحيحة؟',
                options: ['نعم', 'لا'],
                correctIndex: 1,
                explanation: 'إجابة غير صحيحة؛ لأن (فردي + فردي = زوجي) + زوجي = عدد زوجي، والـ 21 عدد فردي.'
            },
            {
                title: 'تكوين العدد (فهد) 🧩',
                text: 'كوّن فهد عدداً من ٣ أرقام باستخدام (٢ ، ٣ ، ٦). إذا كان العدد فردياً ورقم المئات أكبر من ٢، فما هو العدد؟',
                options: ['٦٢٣', '٢٦٣', '٣٦٢', '٦٣٢'],
                correctIndex: 0,
                explanation: 'العدد ٦٢٣ هو الوحيد الفردي (آحاده ٣) ورقم مئاته (٦) أكبر من ٢.'
            }
        ];

        let availableIndices = [0, 1, 2, 3, 4, 5, 6, 7, 8];

        function spinWheel() {
            if (availableIndices.length === 0) return;

            spinBtn.disabled = true;
            resultMsg.innerText = '';
            
            const randomListPos = Math.floor(Math.random() * availableIndices.length);
            const chosenSectorIndex = availableIndices[randomListPos];

            availableIndices.splice(randomListPos, 1);

            const targetSectorAngle = 360 - (chosenSectorIndex * 40 + 20);
            
            const extraRounds = 360 * 5;
            const currentMod = currentRotation % 360;
            let neededDegrees = targetSectorAngle - currentMod;
            if (neededDegrees <= 0) neededDegrees += 360;

            currentRotation += extraRounds + neededDegrees;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // محاكاة صوت تكتكة العجلة أثناء الدوران
            let ticks = 0;
            const maxTicks = 25;
            const interval = setInterval(() => {
                playTickSound();
                ticks++;
                if (ticks >= maxTicks) clearInterval(interval);
            }, 150);

            setTimeout(() => {
                showQuestion(chosenSectorIndex);
            }, 4000);
        }

        function showQuestion(index) {
            const q = questions[index];
            modalHeader.innerText = q.title;
            questionText.innerText = q.text;
            optionsContainer.innerHTML = '';
            resultMsg.innerText = '';

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(optIndex, q.correctIndex, q.explanation);
                optionsContainer.appendChild(btn);
            });

            modal.style.display = 'flex';
        }

        function checkAnswer(selectedIndex, correctIndex, explanation) {
            const correctPhrases = [
                "أحسنت! إجابة رائعة وصحيحة",
                "ممتاز! بارك الله فيك",
                "رائع جداً! إجابة متميزة",
                "بطل! إجابتك صحيحة"
            ];
            const wrongPhrases = [
                "حاول مرة أخرى! أنت قادر على حلها",
                "إجابة غير صحيحة، فكر جيداً في المرة القادمة",
                "ركز أكثر، يمكنك فعلها!"
            ];

            if (selectedIndex === correctIndex) {
                resultMsg.className = 'result-msg correct';
                resultMsg.innerText = '🎉 إجابة صحيحة!\n\n💡 التوضيح: ' + explanation;
                
                const randomCorrectText = correctPhrases[Math.floor(Math.random() * correctPhrases.length)];
                speakText(randomCorrectText);
            } else {
                resultMsg.className = 'result-msg wrong';
                resultMsg.innerText = '❌ إجابة خاطئة!\n\n💡 التوضيح: ' + explanation;
                
                const randomWrongText = wrongPhrases[Math.floor(Math.random() * wrongPhrases.length)];
                speakText(randomWrongText);
            }
        }

        function closeModal() {
            window.speechSynthesis.cancel(); // إيقاف الصوت عند إغلاق النافذة
            modal.style.display = 'none';
            counter.innerText = `الأسئلة المتبقية: ${availableIndices.length} من 9`;

            if (availableIndices.length > 0) {
                spinBtn.disabled = false;
            } else {
                spinBtn.disabled = true;
                spinBtn.innerText = '🏁 انتهت جميع الأسئلة!';
                counter.innerText = '🎉 أحسنت! تم المرور على جميع الأسئلة.';
                speakText("مبروك! لقد أكملت جميع الأسئلة بنجاح!");
            }
        }
    </script>
</body>
</html>
