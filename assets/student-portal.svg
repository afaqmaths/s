<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
<title id="title">طالب بواجهة أمامية</title>
<desc id="desc">رسم توضيحي لطالب بوجه أمامي واضح وملامح ظاهرة وقبعة تعليمية</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#f4f9ff"/>
    <stop offset="1" stop-color="#dcefff"/>
  </linearGradient>
  <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#2d83da"/>
    <stop offset="1" stop-color="#145aa7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173b63" flood-opacity=".18"/>
  </filter>
</defs>
<rect x="10" y="10" width="340" height="340" rx="46" fill="url(#bg)"/>
<g filter="url(#shadow)">
  <!-- Graduation cap, clearly front-facing -->
  <path d="M72 91 180 45l108 46-108 47z" fill="#173d6a"/>
  <path d="M111 111h138v18c0 18-31 33-69 33s-69-15-69-33z" fill="#245184"/>
  <path d="M281 92v63" stroke="#dca827" stroke-width="6" stroke-linecap="round"/>
  <circle cx="281" cy="162" r="8" fill="#dca827"/>

  <!-- Face -->
  <circle cx="180" cy="137" r="54" fill="#efc6a8"/>
  <!-- Hairline -->
  <path d="M128 129c9-31 95-34 104-1-10 9-29 19-52 20-23-2-41-10-52-19z" fill="#44302a"/>
  <!-- Ears -->
  <ellipse cx="126" cy="142" rx="8" ry="12" fill="#e8b996"/>
  <ellipse cx="234" cy="142" rx="8" ry="12" fill="#e8b996"/>
  <!-- Brows -->
  <path d="M145 132c7-5 16-6 24-3" fill="none" stroke="#4a342d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M191 129c8-3 17-2 24 3" fill="none" stroke="#4a342d" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="157" cy="142" rx="5" ry="6" fill="#2f211e"/>
  <ellipse cx="203" cy="142" rx="5" ry="6" fill="#2f211e"/>
  <circle cx="158.5" cy="140" r="1.5" fill="#fff"/>
  <circle cx="204.5" cy="140" r="1.5" fill="#fff"/>
  <!-- Nose -->
  <path d="M180 145c-2 8-3 13 3 16" fill="none" stroke="#b67d65" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M158 172c13 11 31 11 44 0" fill="none" stroke="#9c5849" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Torso -->
  <path d="M104 246c0-42 33-68 76-68s76 26 76 68v68H104z" fill="url(#shirt)"/>
  <path d="M180 183v126" stroke="#d7e8f8" stroke-width="5" opacity=".8"/>
  <circle cx="180" cy="220" r="5.5" fill="#f0d16a"/>

  <!-- Book -->
  <rect x="98" y="245" width="164" height="78" rx="14" fill="#fff" stroke="#bfd2e5" stroke-width="4"/>
  <rect x="115" y="260" width="130" height="47" rx="8" fill="#fff4c7"/>
  <path d="M132 278h96M132 293h70" stroke="#d0a22a" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>